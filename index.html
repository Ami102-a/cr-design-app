<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住宅広告 プロンプトウィザード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
  :root {
    --navy:        #1A2844;
    --navy-light:  #243558;
    --navy-muted:  #4A6098;
    --blue:        #3B6EBF;
    --blue-light:  #EBF0FA;
    --white:       #FFFFFF;
    --bg:          #F0F3FA;
    --gray-100:    #EEF1F8;
    --gray-200:    #DDE2EE;
    --gray-400:    #9BA5C2;
    --gray-600:    #5C6880;
    --gray-800:    #2E3A52;
    --success:     #2D7D5F;
    --shadow-sm:   0 1px 4px rgba(26,40,68,0.08);
    --shadow-md:   0 4px 16px rgba(26,40,68,0.12);
    --shadow-lg:   0 8px 32px rgba(26,40,68,0.16);
    --radius:      12px;
    --radius-sm:   8px;
    --transition:  0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--gray-800);
    min-height: 100vh;
    line-height: 1.6;
  }

  /* ── Header ── */
  .app-header {
    background: var(--navy);
    padding: 12px 22px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(26,40,68,0.3);
  }
  .header-icon { color: #7BAFD4; font-size: 22px; flex-shrink: 0; }
  .header-text { flex: 1; min-width: 0; }
  .header-title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .header-title {
    color: var(--white);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .header-client {
    background: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.9);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 10px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    display: none;
  }
  .header-sub {
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    margin-top: 1px;
  }

  /* ── Layout ── */
  .app-container {
    max-width: 640px;
    margin: 0 auto;
    padding: 22px 16px 80px;
  }

  /* ── Progress ── */
  .progress-wrap {
    background: var(--white);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 14px;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--gray-200);
  }
  .progress-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .progress-step-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--gray-400);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .progress-fraction {
    font-size: 20px;
    font-weight: 700;
    color: var(--navy);
    line-height: 1;
  }
  .progress-fraction span { font-size: 13px; color: var(--gray-400); font-weight: 400; }
  .progress-bar {
    height: 3px;
    background: var(--gray-100);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--navy), var(--blue));
    border-radius: 2px;
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .step-dots { display: flex; gap: 5px; }
  .step-dot {
    height: 3px;
    flex: 1;
    border-radius: 2px;
    background: var(--gray-200);
    transition: background var(--transition);
  }
  .step-dot.done    { background: var(--navy); }
  .step-dot.current { background: var(--blue); }

  /* ── Wizard Card ── */
  .wizard-card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--gray-200);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    animation: slideIn 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-header { background: var(--navy); padding: 20px 24px 16px; }
  .step-badge {
    display: inline-block;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.65);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 8px;
    text-transform: uppercase;
  }
  .card-title { color: var(--white); font-size: 17px; font-weight: 700; line-height: 1.3; }
  .card-subtitle { color: rgba(255,255,255,0.45); font-size: 12px; margin-top: 5px; }
  .card-body { padding: 20px 22px; }

  /* ── Mode Selection ── */
  .mode-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .mode-btn {
    border: 1.5px solid var(--gray-200);
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 26px 14px 22px;
    cursor: pointer;
    text-align: center;
    transition: all var(--transition);
    font-family: 'Noto Sans JP', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .mode-btn:hover { border-color: var(--navy-muted); background: var(--blue-light); }
  .mode-icon { font-size: 36px; color: var(--navy-muted); display: block; }
  .mode-name { font-weight: 700; font-size: 14px; color: var(--gray-800); display: block; line-height: 1.4; }
  .mode-desc { font-size: 11px; color: var(--gray-400); display: block; line-height: 1.6; }

  /* ── Client Selection ── */
  .client-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }
  .client-btn {
    border: 1.5px solid var(--gray-200);
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 16px 14px;
    cursor: pointer;
    text-align: left;
    transition: all var(--transition);
    font-family: 'Noto Sans JP', sans-serif;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .client-btn:hover { border-color: var(--navy-muted); background: var(--blue-light); }
  .client-btn.selected {
    border-color: var(--navy);
    background: var(--navy);
    color: var(--white);
    box-shadow: 0 2px 10px rgba(26,40,68,0.2);
  }
  .client-btn .material-icons {
    font-size: 20px;
    color: var(--gray-400);
    flex-shrink: 0;
    margin-top: 1px;
  }
  .client-btn.selected .material-icons { color: rgba(255,255,255,0.65); }
  .client-btn-text { flex: 1; }
  .client-btn-name { font-weight: 700; font-size: 14px; display: block; color: var(--gray-800); }
  .client-btn.selected .client-btn-name { color: var(--white); }
  .client-btn-sub { font-size: 11px; color: var(--gray-400); display: block; margin-top: 2px; }
  .client-btn.selected .client-btn-sub { color: rgba(255,255,255,0.5); }

  .client-generic-btn {
    width: 100%;
    border: 1.5px dashed var(--gray-200);
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 13px 16px;
    cursor: pointer;
    text-align: left;
    transition: all var(--transition);
    font-family: 'Noto Sans JP', sans-serif;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--gray-600);
  }
  .client-generic-btn:hover { border-color: var(--gray-400); background: var(--gray-100); }
  .client-generic-btn.selected {
    border-style: solid;
    border-color: var(--navy);
    background: var(--navy);
    color: var(--white);
  }
  .client-generic-btn .material-icons { font-size: 18px; color: var(--gray-400); }
  .client-generic-btn.selected .material-icons { color: rgba(255,255,255,0.65); }
  .client-generic-label { font-weight: 600; font-size: 14px; }

  /* ── Option Buttons ── */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .options-grid.odd-last > .option-btn:last-child:nth-child(odd) { grid-column: 1 / -1; }

  .option-btn {
    border: 1.5px solid var(--gray-200);
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    cursor: pointer;
    text-align: left;
    transition: all var(--transition);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: var(--gray-800);
  }
  .option-btn:hover { border-color: var(--navy-muted); background: var(--blue-light); }
  .option-btn.selected {
    border-color: var(--navy);
    background: var(--navy);
    color: var(--white);
    box-shadow: 0 2px 10px rgba(26,40,68,0.2);
  }
  .opt-main { font-weight: 700; font-size: 15px; display: block; margin-bottom: 2px; }
  .opt-sub { font-size: 11px; color: var(--gray-600); font-weight: 400; display: block; }
  .option-btn.selected .opt-sub { color: rgba(255,255,255,0.55); }

  /* ── Yes/No ── */
  .yesno-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .yesno-btn {
    border: 2px solid var(--gray-200);
    background: var(--white);
    border-radius: var(--radius-sm);
    padding: 22px 16px;
    cursor: pointer;
    text-align: center;
    transition: all var(--transition);
    font-family: 'Noto Sans JP', sans-serif;
  }
  .yesno-btn:hover { border-color: var(--navy-muted); background: var(--blue-light); }
  .yesno-btn.selected {
    border-color: var(--navy);
    background: var(--navy);
    box-shadow: 0 3px 12px rgba(26,40,68,0.22);
  }
  .yesno-icon { display: block; font-size: 26px; color: var(--gray-400); margin-bottom: 8px; }
  .yesno-btn.selected .yesno-icon { color: rgba(255,255,255,0.65); }
  .yesno-label { font-size: 16px; font-weight: 700; display: block; color: var(--gray-800); }
  .yesno-btn.selected .yesno-label { color: var(--white); }
  .yesno-sub { font-size: 11px; color: var(--gray-400); margin-top: 3px; display: block; }
  .yesno-btn.selected .yesno-sub { color: rgba(255,255,255,0.5); }

  /* ── Text / Date / Textarea Input ── */
  .input-group { margin-bottom: 0; }
  .text-input, .date-input {
    width: 100%;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    color: var(--gray-800);
    background: var(--white);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .text-input:focus, .date-input:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 3px rgba(26,40,68,0.07);
  }
  .text-input::placeholder { color: var(--gray-400); font-weight: 300; }
  .textarea-input {
    resize: vertical;
    min-height: 130px;
    line-height: 1.8;
  }
  .input-hint { font-size: 12px; color: var(--gray-400); margin-top: 7px; line-height: 1.5; }

  /* ── Navigation ── */
  .card-footer { padding: 0 22px 22px; display: flex; gap: 8px; align-items: center; }
  .btn {
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px 18px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .btn .material-icons { font-size: 18px; }
  .btn-primary { background: var(--navy); color: var(--white); flex: 1; justify-content: center; }
  .btn-primary:hover { background: var(--navy-light); box-shadow: 0 3px 12px rgba(26,40,68,0.25); }
  .btn-secondary {
    background: var(--gray-100);
    color: var(--gray-600);
    width: 44px; height: 44px;
    padding: 0;
    justify-content: center;
    flex-shrink: 0;
  }
  .btn-secondary:hover { background: var(--gray-200); color: var(--gray-800); }
  .btn-secondary .material-icons { font-size: 20px; }
  .btn-skip {
    background: transparent;
    color: var(--gray-400);
    border: 1.5px solid var(--gray-200);
    padding: 10px 13px;
    font-weight: 500;
    font-size: 12px;
    flex-shrink: 0;
  }
  .btn-skip:hover { border-color: var(--gray-400); color: var(--gray-600); }

  /* ── Result ── */
  .result-card {
    background: var(--white);
    border-radius: var(--radius);
    border: 1px solid var(--gray-200);
    box-shadow: var(--shadow-lg);
    overflow: hidden;
    animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .result-header { background: var(--navy); padding: 20px 24px; }
  .result-header-label {
    color: rgba(255,255,255,0.45);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .result-header-title {
    color: var(--white);
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .result-header-title .material-icons { color: #7BAFD4; font-size: 20px; }
  .result-body { padding: 20px 22px; }
  .prompt-box {
    background: var(--bg);
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 16px;
    font-size: 14px;
    line-height: 1.9;
    color: var(--gray-800);
    white-space: pre-wrap;
    word-break: break-all;
    margin-bottom: 14px;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .action-btn {
    width: 100%;
    border: none;
    border-radius: var(--radius-sm);
    padding: 13px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-bottom: 10px;
  }
  .action-btn .material-icons { font-size: 18px; }
  .chatgpt-btn { background: #0A7F5B; color: var(--white); }
  .chatgpt-btn:hover { background: #08694A; box-shadow: 0 3px 14px rgba(10,127,91,0.3); }
  .chatgpt-note {
    font-size: 12px;
    color: #2D6E52;
    line-height: 1.7;
    padding: 10px 14px;
    background: #EAF7F2;
    border: 1px solid rgba(10,127,91,0.18);
    border-radius: var(--radius-sm);
    margin-bottom: 10px;
    display: none;
    text-align: center;
  }
  .copy-btn { background: var(--navy); color: var(--white); }
  .copy-btn:hover { background: var(--navy-light); box-shadow: 0 3px 12px rgba(26,40,68,0.25); }
  .copy-btn.copied { background: var(--success); }
  .result-actions { padding: 0 22px 22px; display: flex; gap: 8px; }
  .btn-restart, .btn-change-client {
    flex: 1;
    border: none;
    border-radius: var(--radius-sm);
    padding: 11px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
  }
  .btn-restart { background: var(--gray-100); color: var(--gray-600); }
  .btn-restart:hover { background: var(--gray-200); color: var(--gray-800); }
  .btn-change-client { background: var(--blue-light); color: var(--blue); border: 1.5px solid rgba(59,110,191,0.25); }
  .btn-change-client:hover { background: #dce6f7; }
  .btn-restart .material-icons, .btn-change-client .material-icons { font-size: 16px; }

  /* ── History ── */
  .history-section { margin-top: 26px; }
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .history-title { font-size: 13px; font-weight: 700; color: var(--navy); display: flex; align-items: center; gap: 6px; }
  .history-title .material-icons { font-size: 17px; color: var(--gray-400); }
  .history-count {
    background: var(--navy);
    color: white;
    font-size: 10px;
    font-weight: 700;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .clear-all-btn {
    font-size: 12px;
    color: var(--gray-400);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: 'Noto Sans JP', sans-serif;
    transition: color var(--transition);
  }
  .clear-all-btn:hover { color: #C0392B; }
  .history-empty {
    background: var(--white);
    border: 1.5px dashed var(--gray-200);
    border-radius: var(--radius);
    padding: 28px;
    text-align: center;
    color: var(--gray-400);
    font-size: 13px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .history-empty .material-icons { font-size: 30px; color: var(--gray-200); }
  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-card {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-sm);
    padding: 13px 15px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition);
  }
  .history-card:hover { box-shadow: var(--shadow-md); }
  .history-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; gap: 8px; }
  .history-badge {
    background: var(--navy);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 20px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
  }
  .history-date { font-size: 11px; color: var(--gray-400); flex-shrink: 0; }
  .history-preview {
    font-size: 12px;
    color: var(--gray-600);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .history-actions { display: flex; gap: 6px; }
  .h-btn {
    border: 1.5px solid var(--gray-200);
    background: var(--white);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    font-family: 'Noto Sans JP', sans-serif;
    color: var(--gray-600);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .h-btn .material-icons { font-size: 14px; }
  .h-btn:hover { border-color: var(--navy); color: var(--navy); }
  .h-btn.copied { border-color: var(--success); color: var(--success); }
  .h-btn.del { margin-left: auto; }
  .h-btn.del:hover { border-color: #C0392B; color: #C0392B; }

  /* ── Responsive ── */
  @media (max-width: 480px) {
    .app-container { padding: 14px 12px 60px; }
    .card-header   { padding: 16px 16px 14px; }
    .card-body     { padding: 16px; }
    .card-footer   { padding: 0 16px 16px; }
    .result-body   { padding: 16px; }
    .result-actions { padding: 0 16px 16px; flex-direction: column; }
    .card-title    { font-size: 15px; }
    .options-grid  { grid-template-columns: 1fr; }
    .options-grid.odd-last > .option-btn:last-child:nth-child(odd) { grid-column: auto; }
    .client-grid   { grid-template-columns: 1fr; }
    .mode-grid     { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="app-header">
  <span class="material-icons header-icon">home</span>
  <div class="header-text">
    <div class="header-title-row">
      <span class="header-title">住宅広告 プロンプトウィザード</span>
      <span class="header-client" id="headerClient"></span>
    </div>
    <div class="header-sub">画像生成プロンプトを作成</div>
  </div>
</header>

<div class="app-container">
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-top">
      <div class="progress-step-label">STEP</div>
      <div class="progress-fraction" id="progressFraction">1<span> / 8</span></div>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:12.5%"></div>
    </div>
    <div class="step-dots" id="stepDots"></div>
  </div>

  <div id="wizardArea"></div>

  <div class="history-section">
    <div class="history-header">
      <div class="history-title">
        <span class="material-icons">history</span>
        生成履歴
        <div class="history-count" id="historyCount">0</div>
      </div>
      <button class="clear-all-btn" onclick="clearAllHistory()">すべて削除</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<script>
// ─── クライアントデータ ──────────────────────────────────────────

// ─── Header ──────────────────────────────────────────────────────────
function updateHeaderClient() {
  const el = document.getElementById('headerClient');
  if (state.isClientSelected && state.selectedClient) {
    el.textContent = state.selectedClient.name;
    el.style.display = '';
  } else if (state.isClientSelected && !state.selectedClient) {
    el.textContent = '汎用';
    el.style.display = '';
  } else {
    el.style.display = 'none';
  }
}

// ─── Rendering ───────────────────────────────────────────────────────
function renderProgress() {
  const activeSteps = getCurrentActiveSteps();
  const total = activeSteps.length;
  const isResult = state.currentStep >= total;
  const showProgress = state.isClientSelected && !isResult;
  document.getElementById('progressWrap').style.display = showProgress ? '' : 'none';
  if (!showProgress) return;

  const step = state.currentStep;
  document.getElementById('progressFraction').innerHTML = `${step + 1}<span> / ${total}</span>`;
  document.getElementById('progressFill').style.width = ((step + 1) / total * 100) + '%';

  const dotsEl = document.getElementById('stepDots');
  dotsEl.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = document.createElement('div');
    d.className = 'step-dot' + (i < step ? ' done' : i === step ? ' current' : '');
    dotsEl.appendChild(d);
  }
}

function renderStep() {
  updateHeaderClient();
  const area = document.getElementById('wizardArea');
  area.innerHTML = '';

  // モード未選択
  if (!state.mode) {
    document.getElementById('progressWrap').style.display = 'none';
    area.appendChild(buildModeSelection());
    return;
  }

  // 顧客未選択
  if (!state.isClientSelected) {
    document.getElementById('progressWrap').style.display = 'none';
    area.appendChild(buildClientSelection());
    return;
  }

  renderProgress();
  const activeSteps = getCurrentActiveSteps();
  if (state.currentStep >= activeSteps.length) {
    area.appendChild(state.mode === 'flyer' ? buildFlyerResult() : buildAdResult());
    renderHistory();
    return;
  }

  area.appendChild(buildStepCard(activeSteps[state.currentStep]));
}

// ─── Mode Selection ───────────────────────────────────────────────────
function buildModeSelection() {
  const card = document.createElement('div');
  card.className = 'wizard-card';
  card.innerHTML = `
    <div class="card-header">
      <div class="step-badge">START</div>
      <div class="card-title">モードを選んでください</div>
      <div class="card-subtitle">作成したいコンテンツのタイプを選択してください</div>
    </div>
    <div class="card-body">
      <div class="mode-grid">
        <button class="mode-btn" onclick="selectMode('ad')">
          <span class="material-icons mode-icon">image</span>
          <span class="mode-name">広告画像モード</span>
          <span class="mode-desc">SNS広告・バナー画像の<br>プロンプトを生成</span>
        </button>
        <button class="mode-btn" onclick="selectMode('flyer')">
          <span class="material-icons mode-icon">description</span>
          <span class="mode-name">チラシラフ案<br>モード</span>
          <span class="mode-desc">チラシのラフ案を<br>ChatGPTで生成</span>
        </button>
      </div>
    </div>
  `;
  return card;
}

function selectMode(mode) {
  state.mode = mode;
  state.currentStep = 0;
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Client Selection ─────────────────────────────────────────────────
function buildClientSelection() {
  const card = document.createElement('div');
  card.className = 'wizard-card';

  card.innerHTML = `
    <div class="card-header">
      <div class="step-badge">STEP 0</div>
      <div class="card-title">顧客を選択してください</div>
      <div class="card-subtitle">広告を作成する企業・ブランドを選択してください</div>
    </div>
    <div class="card-body">
      <div class="client-grid" id="clientGrid"></div>
      <button class="client-generic-btn" id="genericBtn">
        <span class="material-icons">public</span>
        <span class="client-generic-label">顧客なし（汎用）</span>
      </button>
    </div>
    <div class="card-footer">
      <button class="btn btn-secondary" onclick="goBackToModeSelection()" title="モード選択に戻る">
        <span class="material-icons">arrow_back</span>
      </button>
      <button class="btn btn-primary" onclick="confirmClientSelection()">
        次へ <span class="material-icons">arrow_forward</span>
      </button>
    </div>
  `;

  const grid = card.querySelector('#clientGrid');
  CLIENTS.forEach(client => {
    const btn = document.createElement('button');
    btn.className = 'client-btn';
    if (state.selectedClient && state.selectedClient.id === client.id) btn.classList.add('selected');
    btn.innerHTML = `
      <span class="material-icons">business</span>
      <span class="client-btn-text">
        <span class="client-btn-name">${escHtml(client.name)}</span>
        <span class="client-btn-sub">${escHtml(client.referenceUrl)}</span>
      </span>
    `;
    btn.onclick = () => {
      state.selectedClient = client;
      grid.querySelectorAll('.client-btn').forEach(b => b.classList.remove('selected'));
      card.querySelector('#genericBtn').classList.remove('selected');
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });

  const genericBtn = card.querySelector('#genericBtn');
  if (state.selectedClient === null && state.isClientSelected) genericBtn.classList.add('selected');
  genericBtn.onclick = () => {
    state.selectedClient = null;
    grid.querySelectorAll('.client-btn').forEach(b => b.classList.remove('selected'));
    genericBtn.classList.add('selected');
  };

  return card;
}

function goBackToModeSelection() {
  state.mode = null;
  state.isClientSelected = false;
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function confirmClientSelection() {
  state.isClientSelected = true;
  state.currentStep = 0;
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── Wizard Card ──────────────────────────────────────────────────────
function buildStepCard(s) {
  const card = document.createElement('div');
  card.className = 'wizard-card';

  const activeSteps = getCurrentActiveSteps();

  const hdr = document.createElement('div');
  hdr.className = 'card-header';
  hdr.innerHTML = `
    <div class="step-badge">STEP ${state.currentStep + 1} / ${activeSteps.length}</div>
    <div class="card-title">${escHtml(s.title)}</div>
    ${s.subtitle ? `<div class="card-subtitle">${escHtml(s.subtitle)}</div>` : ''}
  `;
  card.appendChild(hdr);

  const body = document.createElement('div');
  body.className = 'card-body';
  if      (s.type === 'single')   body.appendChild(buildSingleOptions(s));
  else if (s.type === 'yesno')    body.appendChild(buildYesNo(s));
  else if (s.type === 'text')     body.appendChild(buildTextInput(s));
  else if (s.type === 'textarea') body.appendChild(buildTextareaInput(s));
  else if (s.type === 'date')     body.appendChild(buildDateInput());
  card.appendChild(body);

  const footer = document.createElement('div');
  footer.className = 'card-footer';

  const backBtn = document.createElement('button');
  backBtn.className = 'btn btn-secondary';
  backBtn.innerHTML = '<span class="material-icons">arrow_back</span>';
  backBtn.title = state.currentStep > 0 ? '戻る' : '顧客選択に戻る';
  backBtn.onclick = () => {
    if (state.currentStep > 0) { state.currentStep--; renderStep(); }
    else { state.isClientSelected = false; renderStep(); }
  };
  footer.appendChild(backBtn);

  const isLast = state.currentStep === activeSteps.length - 1;
  const nextBtn = document.createElement('button');
  nextBtn.className = 'btn btn-primary';
  nextBtn.innerHTML = isLast
    ? '<span class="material-icons">auto_awesome</span> プロンプトを生成'
    : '次へ <span class="material-icons">arrow_forward</span>';
  nextBtn.onclick = () => handleNext();
  footer.appendChild(nextBtn);

  if (!s.required) {
    const skipBtn = document.createElement('button');
    skipBtn.className = 'btn btn-skip';
    skipBtn.textContent = 'スキップ';
    skipBtn.onclick = () => {
      state.currentStep++;
      if (state.currentStep >= getCurrentActiveSteps().length) {
        saveToHistory(state.mode === 'flyer' ? generateFlyerPrompt() : generateAdPrompt());
      }
      renderStep();
    };
    footer.appendChild(skipBtn);
  }

  card.appendChild(footer);
  return card;
}

// ─── Input Builders ───────────────────────────────────────────────────
function buildSingleOptions(s) {
  const answers = getAnswers();
  const wrap = document.createElement('div');
  const grid = document.createElement('div');
  grid.className = 'options-grid' + (s.options.length % 2 !== 0 ? ' odd-last' : '');

  s.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    if (answers[s.id] === opt.value) btn.classList.add('selected');
    btn.innerHTML = `
      <span class="opt-main">${escHtml(opt.label)}</span>
      ${opt.sub ? `<span class="opt-sub">${escHtml(opt.sub)}</span>` : ''}
    `;
    btn.onclick = () => {
      answers[s.id] = opt.value;
      grid.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });

  wrap.appendChild(grid);
  return wrap;
}

function buildYesNo(s) {
  const answers = getAnswers();
  const grid = document.createElement('div');
  grid.className = 'yesno-grid';

  s.options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'yesno-btn';
    if (answers[s.id] === opt.value) btn.classList.add('selected');
    btn.innerHTML = `
      <span class="material-icons yesno-icon">${opt.icon}</span>
      <span class="yesno-label">${escHtml(opt.label)}</span>
      <span class="yesno-sub">${escHtml(opt.sub)}</span>
    `;
    btn.onclick = () => {
      answers[s.id] = opt.value;
      grid.querySelectorAll('.yesno-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    grid.appendChild(btn);
  });

  return grid;
}

function buildTextInput(s) {
  const answers = getAnswers();
  const wrap = document.createElement('div');
  wrap.className = 'input-group';
  wrap.innerHTML = `
    <input class="text-input" type="text"
      placeholder="${escAttr(s.placeholder || '')}"
      value="${escAttr(answers[s.id] || '')}">
    ${s.hint ? `<div class="input-hint">${escHtml(s.hint)}</div>` : ''}
  `;
  wrap.querySelector('input').addEventListener('input', e => { answers[s.id] = e.target.value; });
  return wrap;
}

function buildTextareaInput(s) {
  const answers = getAnswers();
  const wrap = document.createElement('div');
  wrap.className = 'input-group';
  wrap.innerHTML = `
    <textarea class="text-input textarea-input"
      placeholder="${escAttr(s.placeholder || '')}"
      rows="7">${escHtml(answers[s.id] || '')}</textarea>
    ${s.hint ? `<div class="input-hint">${escHtml(s.hint)}</div>` : ''}
  `;
  wrap.querySelector('textarea').addEventListener('input', e => { answers[s.id] = e.target.value; });
  return wrap;
}

function buildDateInput() {
  const answers = getAnswers();
  const wrap = document.createElement('div');
  wrap.className = 'input-group';
  wrap.innerHTML = `
    <input class="date-input" type="date" value="${escAttr(answers.date || '')}">
    <div class="input-hint">開催日を選択してください</div>
  `;
  wrap.querySelector('input').addEventListener('change', e => { answers.date = e.target.value; });
  return wrap;
}

// ─── Navigation ───────────────────────────────────────────────────────
function handleNext() {
  state.currentStep++;
  if (state.currentStep >= getCurrentActiveSteps().length) {
    saveToHistory(state.mode === 'flyer' ? generateFlyerPrompt() : generateAdPrompt());
  }
  renderStep();
}

// ─── Ad Prompt Generation ─────────────────────────────────────────────
function generateAdPrompt() {
  const a = state.answers;
  const lines = ['添付画像を使用して画像を生成してください。', ''];

  if (a.ratio)     lines.push(`アスペクト比：${a.ratio}`);
  const taste = state.selectedClient ? state.selectedClient.defaultTaste : a.taste;
  if (taste)       lines.push(`テイスト：${taste}`);
  if (a.title)     lines.push(`タイトル：${a.title}`);
  if (a.catchcopy) lines.push(`キャッチコピー：${a.catchcopy}`);
  if (a.date) {
    const dt = new Date(a.date + 'T00:00:00');
    lines.push(`日付：${dt.getFullYear()}年${dt.getMonth() + 1}月${dt.getDate()}日`);
  }
  if (a.venue)   lines.push(`開催場所：${a.venue}`);
  if (a.benefit) lines.push(`特典：${a.benefit}`);
  if (a.logo)    lines.push(`ロゴ：${a.logo}`);

  lines.push('');
  appendBrandBlock(lines);

  return lines.join('\n').trim();
}

// ─── Flyer Prompt Generation ──────────────────────────────────────────
function generateFlyerPrompt() {
  const a = state.flyerAnswers;
  const lines = ['以下の情報をもとにチラシのラフ案を作成してください。', ''];

  if (a.size) lines.push(`サイズ：${a.size}`);
  lines.push('');

  if (a.memo && a.memo.trim()) {
    lines.push('【MTGメモの内容】');
    lines.push(a.memo.trim());
    lines.push('');
  }

  if (a.refImage === 'あり') {
    lines.push('【参考画像】');
    lines.push('添付の参考画像のデザインテイストを参考にしてください。');
    lines.push('');
  }

  if (a.extra && a.extra.trim()) {
    lines.push('【追加情報】');
    lines.push(a.extra.trim());
    lines.push('');
  }

  appendBrandBlock(lines);

  lines.push('【出力指示】');
  lines.push('チラシのラフ案として、レイアウト・配色・文字構成を含めた');
  lines.push('ビジュアルイメージを生成してください。');
  lines.push('文字は正確に読めるように配置すること。');

  return lines.join('\n').trim();
}

// ─── Brand Block Helper ───────────────────────────────────────────────
function appendBrandBlock(lines) {
  const c = state.selectedClient;
  if (!c) return;

  lines.push('【ブランドデザイン指示】');
  if (c.colors) {
    lines.push(`カラー：メイン ${c.colors.main.hex}（${c.colors.main.name}）、`);
    lines.push(`　　　　アクセント ${c.colors.accent.hex}（${c.colors.accent.name}）、`);
    lines.push(`　　　　ベース ${c.colors.base.hex}（${c.colors.base.name}）を使用すること`);
  }
  if (c.fonts) {
    lines.push(`フォント：タイトルは${c.fonts.title}、本文は${c.fonts.body}、`);
    lines.push(`　　　　　欧文は${c.fonts.latin}を使用`);
  }
  if (c.defaultTaste) lines.push(`テイスト：${c.defaultTaste}`);
  if (c.photoTone)    lines.push(`写真トーン：${c.photoTone}`);
  if (c.ngRules && c.ngRules.length > 0) {
    lines.push(`NGルール：${c.ngRules[0]} /`);
    for (let i = 1; i < c.ngRules.length; i++) {
      const suffix = i < c.ngRules.length - 1 ? ' /' : '';
      lines.push(`　　　　　${c.ngRules[i]}${suffix}`);
    }
  }
  if (c.referenceUrl) lines.push(`参考HP：${c.referenceUrl}`);
  lines.push('');
}

// ─── Result Screens ───────────────────────────────────────────────────
function buildAdResult() {
  return buildResultCard(generateAdPrompt(), '広告画像プロンプトが完成しました');
}

function buildFlyerResult() {
  return buildResultCard(generateFlyerPrompt(), 'チラシラフ案プロンプトが完成しました');
}

function buildResultCard(prompt, title) {
  const isFlyerWithRef = state.mode === 'flyer' && state.flyerAnswers.refImage === 'あり';
  const noteText = isFlyerWithRef
    ? 'プロンプトを自動コピーしました。ChatGPTの入力欄に貼り付けて、参考画像も一緒に添付して送信してください。'
    : 'プロンプトを自動コピーしました。ChatGPTの入力欄に貼り付けて、写真も一緒に添付して送信してください。';

  const wrap = document.createElement('div');
  const card = document.createElement('div');
  card.className = 'result-card';
  card.innerHTML = `
    <div class="result-header">
      <div class="result-header-label">COMPLETE</div>
      <div class="result-header-title">
        <span class="material-icons">auto_awesome</span>
        ${escHtml(title)}
      </div>
    </div>
    <div class="result-body">
      <div class="prompt-box">${escHtml(prompt)}</div>
      <button class="action-btn chatgpt-btn" onclick="openChatGPT(this)">
        <span class="material-icons">open_in_new</span>
        ChatGPTで開く
      </button>
      <div class="chatgpt-note" id="chatgptNote">${escHtml(noteText)}</div>
      <button class="action-btn copy-btn" onclick="copyPrompt(this)">
        <span class="material-icons">content_copy</span>
        プロンプトをコピー
      </button>
    </div>
    <div class="result-actions">
      <button class="btn-change-client" onclick="changeClient()">
        <span class="material-icons">business</span>
        顧客を変更
      </button>
      <button class="btn-restart" onclick="restartWizard()">
        <span class="material-icons">refresh</span>
        同じ顧客でやり直す
      </button>
    </div>
  `;
  wrap.appendChild(card);
  return wrap;
}

// ─── Actions ──────────────────────────────────────────────────────────
function getCurrentPrompt() {
  return state.mode === 'flyer' ? generateFlyerPrompt() : generateAdPrompt();
}

function copyPrompt(btn) {
  if (btn.classList.contains('copied')) return;
  const orig = btn.innerHTML;
  navigator.clipboard.writeText(getCurrentPrompt()).then(() => {
    btn.innerHTML = '<span class="material-icons">check_circle</span> コピーしました';
    btn.classList.add('copied');
    setTimeout(() => { btn.innerHTML = orig; btn.classList.remove('copied'); }, 2000);
  });
}

function openChatGPT(btn) {
  const note = document.getElementById('chatgptNote');
  btn.style.opacity = '0.7';
  btn.style.cursor = 'wait';
  const finish = () => {
    if (note) note.style.display = 'block';
    window.open('https://chatgpt.com/', '_blank', 'noopener');
    btn.style.opacity = '';
    btn.style.cursor = '';
  };
  navigator.clipboard.writeText(getCurrentPrompt()).then(finish).catch(finish);
}

function changeClient() {
  state.isClientSelected = false;
  state.selectedClient = null;
  state.currentStep = 0;
  state.answers = { ratio: null, taste: null, title: '', catchcopy: '', date: '', venue: '', benefit: '', logo: null };
  state.flyerAnswers = { size: null, memo: '', refImage: null, extra: '' };
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restartWizard() {
  state.currentStep = 0;
  if (state.mode === 'flyer') {
    state.flyerAnswers = { size: null, memo: '', refImage: null, extra: '' };
  } else {
    state.answers = { ratio: null, taste: null, title: '', catchcopy: '', date: '', venue: '', benefit: '', logo: null };
  }
  renderStep();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── History ──────────────────────────────────────────────────────────
function saveToHistory(prompt) {
  const history = getHistory();
  const modeLabel = state.mode === 'flyer' ? 'チラシラフ案' : '広告画像';
  const clientPart = state.selectedClient ? `${state.selectedClient.name} · ` : '';
  let detail;
  if (state.mode === 'flyer') {
    detail = state.flyerAnswers.size || '—';
  } else {
    const a = state.answers;
    detail = [a.ratio, a.taste].filter(Boolean).join(' / ') || '—';
  }
  const badge = `[${modeLabel}] ${clientPart}${detail}`;
  history.unshift({ id: Date.now(), prompt, badge, createdAt: new Date().toISOString() });
  localStorage.setItem('housingPromptHistory', JSON.stringify(history.slice(0, 10)));
}

function getHistory() {
  try { return JSON.parse(localStorage.getItem('housingPromptHistory') || '[]'); }
  catch { return []; }
}

function renderHistory() {
  const history = getHistory();
  document.getElementById('historyCount').textContent = history.length;
  const list = document.getElementById('historyList');

  if (history.length === 0) {
    list.innerHTML = `
      <div class="history-empty">
        <span class="material-icons">history</span>
        まだ生成履歴がありません
      </div>
    `;
    return;
  }

  list.innerHTML = '';
  history.forEach(entry => {
    const card = document.createElement('div');
    card.className = 'history-card';
    const dt = new Date(entry.createdAt);
    const dateStr = `${dt.getFullYear()}/${pad(dt.getMonth()+1)}/${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;

    card.innerHTML = `
      <div class="history-meta">
        <span class="history-badge">${escHtml(entry.badge)}</span>
        <span class="history-date">${dateStr}</span>
      </div>
      <div class="history-preview">${escHtml(entry.prompt)}</div>
      <div class="history-actions">
        <button class="h-btn copy-h-btn" data-prompt="${escAttr(entry.prompt)}">
          <span class="material-icons">content_copy</span> コピー
        </button>
        <button class="h-btn del" onclick="deleteHistory(${entry.id})">
          <span class="material-icons">delete</span> 削除
        </button>
      </div>
    `;

    const copyBtn = card.querySelector('.copy-h-btn');
    copyBtn.onclick = function() {
      if (this.classList.contains('copied')) return;
      const orig = this.innerHTML;
      navigator.clipboard.writeText(this.dataset.prompt).then(() => {
        this.innerHTML = '<span class="material-icons">check_circle</span> コピー済み';
        this.classList.add('copied');
        setTimeout(() => { this.innerHTML = orig; this.classList.remove('copied'); }, 2000);
      });
    };

    list.appendChild(card);
  });
}

function deleteHistory(id) {
  localStorage.setItem('housingPromptHistory',
    JSON.stringify(getHistory().filter(e => e.id !== id)));
  renderHistory();
}

function clearAllHistory() {
  if (!confirm('すべての履歴を削除しますか？')) return;
  localStorage.removeItem('housingPromptHistory');
  renderHistory();
}

// ─── Helpers ──────────────────────────────────────────────────────────
function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escAttr(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}
function pad(n) { return String(n).padStart(2, '0'); }

// ─── Init ─────────────────────────────────────────────────────────────
renderStep();
renderHistory();
</script>
